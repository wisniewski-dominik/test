name: Development Stage - PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - new_feature*
    types:
      - opened
      - synchronize
      - reopened

env:
  JAVA_VERSION: '21'
  MAVEN_VERSION: '3.9.6'
  PROJECT_NAME: 'my-test-app'

jobs:
  code-quality-and-security:
    name: Code Quality & Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube analysis
          
      # 2. Set up Java
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
#          cache: 'maven'

      # 3. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
          
      # 4. Build with Maven (runs tests, PMD, SpotBugs)
      - name: Build with Maven
        run: |
          mvn -B clean verify \
            -DskipITs=false
        continue-on-error: true

#      # 8. SonarQube Analysis
#      - name: SonarQube Analysis
#        run: |
#          mvn -B sonar:sonar \
#            -Dsonar.projectKey=test-project-key \
#            -Dsonar.projectName=test-project-name \
#            -Dsonar.host.url=http://localhost:9000 \
#            -Dsonar.login= \
#            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
#            -Dsonar.java.spotbugs.reportPaths=target/spotbugsXml.xml \
#            -Dsonar.java.pmd.reportPaths=target/pmd.xml
#        continue-on-error: true
#        if: always()

      # 9. OWASP Dependency-Check
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: ${{ env.PROJECT_NAME }}
          format: 'HTML'
          out: 'reports/dependency-check'
          args: >
            --enableExperimental
            --enableRetired
        continue-on-error: true
        if: always()

      # 10. Build Docker Image (for Trivy scanning)
      - name: Build Docker image for security scanning
        #run: docker build -t ${{ env.PROJECT_NAME }}:pr-${{ github.event.pull_request.number }} .
        run: docker build -t ${{ env.PROJECT_NAME }}:build-${{github.run_number}} .
        continue-on-error: true
        if: always()
#
      # 11. Trivy Container Scanning
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          #image-ref: ${{ env.PROJECT_NAME }}:pr-${{ github.event.pull_request.number }}
          image-ref: ${{ env.PROJECT_NAME }}:build-${{github.run_number}}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
        if: always()

      # 12. Upload Trivy results to GitHub Security tab
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
        if: always()

      # 13. Upload reports as artifacts
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/
          retention-days: 1
        if: always()

      - name: Upload dependency-check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check/
          retention-days: 1
        if: always()

